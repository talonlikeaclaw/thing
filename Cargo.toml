[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws", "macros"] }
clap = { version = "4.6", features = ["derive"] }
csv = "1"
futures-util = "0.3"
http-body-util = "0.1"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
notify = "8.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["std", "serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "rng-getrandom", "serde"] }

[workspace.dependencies.thing-core]
path = "crates/core"
